name: simulated-wallet

services:
  app:
    build:
      context: .
      target: development
    init: true
    environment:
      DATABASE_PATH: /app/data/wallet.sqlite
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - .:/app
      - dependencies:/app/node_modules
      - next-cache:/app/.next
      - wallet-data:/app/data

volumes:
  dependencies:
  next-cache:
  wallet-data:
